name: CI

on: [push]

jobs:
  test:
    name: ${{ matrix.lisp }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this, one broken leg cancels the others before they report,
      # hiding every other platform's result behind it.
      fail-fast: false
      matrix:
        lisp: [sbcl-bin, ccl-bin]
        os: [ubuntu-latest, macOS-latest]

    steps:
      - uses: actions/checkout@v1
      - name: Install Roswell
        env:
          LISP: ${{ matrix.lisp }}
        run: |
          curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | sh
      - name: Install Rove and dependencies
        run: ros install rove cl-store masatoi/cl-libsvm-format
      - name: Run tests
        run: |
          PATH="~/.roswell/bin:$PATH"
          # Not `rove cl-online-learning-test.asd': rove's CLI bypasses test-op, and on
          # ccl-bin it printed not one assertion and still exited 0. This goes through
          # test-op, whose :perform fails both on a red suite and on a suite that
          # registered no tests. It relies on install-for-ci.sh above having registered
          # (:tree "$GITHUB_WORKSPACE/") in the ASDF source registry.
          ./t/run-test.ros
