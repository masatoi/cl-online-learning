name: CI

on: [push]

jobs:
  test:
    name: ${{ matrix.lisp }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        lisp: [sbcl-bin, ccl-bin]
        os: [ubuntu-latest, macOS-latest]

    steps:
      - uses: actions/checkout@v1
      - name: Install Roswell
        env:
          LISP: ${{ matrix.lisp }}
        run: |
          curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | sh
      - name: Install Rove and dependencies
        run: ros install rove cl-store masatoi/cl-libsvm-format
      - name: Run tests
        run: |
          PATH="~/.roswell/bin:$PATH"
          # rove's CLI resolves this .asd via (asdf:load-system (pathname-name file)),
          # with no load-asd step -- it depends on install-for-ci.sh above having
          # already registered (:tree "$GITHUB_WORKSPACE/") in the ASDF source registry.
          rove cl-online-learning-test.asd
